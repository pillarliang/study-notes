<svg viewBox="0 0 960 460" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(20,20,19,0.08)"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="#f5f4ed"/>
  <rect width="100%" height="100%" fill="url(#dots)" opacity="0.45"/>

  <!-- Layer bands (x=96 w=724) each h=44 gap=4 -->
  <!-- L1: AgentLoggingMiddleware y=52 -->
  <rect x="96" y="52" width="724" height="44" rx="4" fill="#faf9f5" stroke="#141413" stroke-width="1"/>
  <text x="128" y="70" fill="#141413" font-size="7"
        font-family="'JetBrains Mono','SF Mono',Consolas,monospace" letter-spacing="0.15em">01 · 最外层</text>
  <text x="220" y="70" fill="#141413" font-size="12" font-weight="600"
        font-family="Charter,Georgia,'Source Han Serif SC',serif">AgentLoggingMiddleware</text>
  <text x="220" y="86" fill="#504e49" font-size="9"
        font-family="'JetBrains Mono','SF Mono',Consolas,monospace">执行日志 · 每步工具调用追踪</text>

  <!-- L2: TodoListMiddleware y=100 -->
  <rect x="96" y="100" width="724" height="44" rx="4" fill="#faf9f5" stroke="#141413" stroke-width="1"/>
  <text x="128" y="118" fill="#141413" font-size="7"
        font-family="'JetBrains Mono','SF Mono',Consolas,monospace" letter-spacing="0.15em">02</text>
  <text x="152" y="118" fill="#141413" font-size="12" font-weight="600"
        font-family="Charter,Georgia,'Source Han Serif SC',serif">TodoListMiddleware</text>
  <text x="152" y="134" fill="#504e49" font-size="9"
        font-family="'JetBrains Mono','SF Mono',Consolas,monospace">任务追踪 · 让模型对多步流程有进度感</text>

  <!-- L3: SubAgentMiddleware y=148 -->
  <rect x="96" y="148" width="724" height="44" rx="4" fill="#faf9f5" stroke="#141413" stroke-width="1"/>
  <text x="128" y="166" fill="#141413" font-size="7"
        font-family="'JetBrains Mono','SF Mono',Consolas,monospace" letter-spacing="0.15em">03</text>
  <text x="152" y="166" fill="#141413" font-size="12" font-weight="600"
        font-family="Charter,Georgia,'Source Han Serif SC',serif">SubAgentMiddleware</text>
  <text x="152" y="182" fill="#504e49" font-size="9"
        font-family="'JetBrains Mono','SF Mono',Consolas,monospace">子 Agent 调度 · MAP-REDUCE 时注入子 Agent</text>

  <!-- L4: SummarizationMiddleware y=196 FOCAL -->
  <rect x="96" y="196" width="724" height="44" rx="4" fill="#EEF2F7" stroke="#1B365D" stroke-width="1.2"/>
  <text x="128" y="214" fill="#1B365D" font-size="7"
        font-family="'JetBrains Mono','SF Mono',Consolas,monospace" letter-spacing="0.15em">04 · FOCAL</text>
  <text x="220" y="214" fill="#141413" font-size="12" font-weight="600"
        font-family="Charter,Georgia,'Source Han Serif SC',serif">SummarizationMiddleware</text>
  <text x="220" y="230" fill="#1B365D" font-size="9"
        font-family="'JetBrains Mono','SF Mono',Consolas,monospace">context 压缩 · 170K token 触发 · 保留最近消息</text>

  <!-- L5: PatchToolCallsMiddleware y=244 -->
  <rect x="96" y="244" width="724" height="44" rx="4" fill="#f0efe8" stroke="#6b6a64" stroke-width="1"/>
  <text x="128" y="262" fill="#6b6a64" font-size="7"
        font-family="'JetBrains Mono','SF Mono',Consolas,monospace" letter-spacing="0.15em">05</text>
  <text x="152" y="262" fill="#141413" font-size="12" font-weight="600"
        font-family="Charter,Georgia,'Source Han Serif SC',serif">PatchToolCallsMiddleware</text>
  <text x="152" y="278" fill="#504e49" font-size="9"
        font-family="'JetBrains Mono','SF Mono',Consolas,monospace">修正模型偶发的工具调用格式错误</text>

  <!-- Core: Agent 执行 y=292 -->
  <rect x="96" y="292" width="724" height="44" rx="4" fill="#eae9e1" stroke="#b8b7b0" stroke-width="1"/>
  <text x="128" y="310" fill="#b8b7b0" font-size="7"
        font-family="'JetBrains Mono','SF Mono',Consolas,monospace" letter-spacing="0.15em">CORE · 最内层</text>
  <text x="252" y="310" fill="#141413" font-size="12" font-weight="600"
        font-family="Charter,Georgia,'Source Han Serif SC',serif">Agent 执行核心</text>
  <text x="252" y="326" fill="#504e49" font-size="9"
        font-family="'JetBrains Mono','SF Mono',Consolas,monospace">LLM 推理 · 工具调用 · 状态读写</text>

  <!-- Left: 请求 down-arrow -->
  <line x1="52" y1="64" x2="52" y2="328" stroke="#504e49" stroke-width="1.2"/>
  <path d="M 47,322 L 52,328 L 57,322"
        fill="none" stroke="#504e49" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="20" y="184" width="52" height="12" rx="2" fill="#f5f4ed"/>
  <text x="46" y="194" fill="#504e49" font-size="8"
        font-family="'JetBrains Mono','SF Mono',Consolas,monospace"
        text-anchor="middle" letter-spacing="0.1em">请求</text>

  <!-- Right: 响应 up-arrow -->
  <line x1="872" y1="328" x2="872" y2="64" stroke="#1B365D" stroke-width="1.4"/>
  <path d="M 867,70 L 872,64 L 877,70"
        fill="none" stroke="#1B365D" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="840" y="184" width="56" height="12" rx="2" fill="#f5f4ed"/>
  <text x="868" y="194" fill="#1B365D" font-size="8"
        font-family="'JetBrains Mono','SF Mono',Consolas,monospace"
        text-anchor="middle" letter-spacing="0.1em">响应</text>

  <!-- Legend -->
  <line x1="40" y1="356" x2="920" y2="356" stroke="rgba(20,20,19,0.10)" stroke-width="0.8"/>
  <text x="40" y="372" fill="#504e49" font-size="8"
        font-family="'JetBrains Mono','SF Mono',Consolas,monospace" letter-spacing="0.22em">LEGEND</text>
  <rect x="140" y="384" width="14" height="10" rx="2" fill="#EEF2F7" stroke="#1B365D" stroke-width="1"/>
  <text x="160" y="392" fill="#504e49" font-size="8.5"
        font-family="Charter,Georgia,'Source Han Serif SC',serif">关键防线（context 压缩）</text>
  <rect x="380" y="384" width="14" height="10" rx="2" fill="#faf9f5" stroke="#141413" stroke-width="1"/>
  <text x="400" y="392" fill="#504e49" font-size="8.5"
        font-family="Charter,Georgia,'Source Han Serif SC',serif">外层 Middleware</text>
  <rect x="548" y="384" width="14" height="10" rx="2" fill="#eae9e1" stroke="#b8b7b0" stroke-width="1"/>
  <text x="568" y="392" fill="#504e49" font-size="8.5"
        font-family="Charter,Georgia,'Source Han Serif SC',serif">核心执行层</text>
</svg>
