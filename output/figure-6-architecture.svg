<svg viewBox="0 0 880 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(20,20,19,0.08)"/>
    </pattern>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#504e49"/>
    </marker>
    <marker id="arr-b" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1B365D"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#f5f4ed"/>
  <rect width="100%" height="100%" fill="url(#dots)" opacity="0.45"/>

  <!-- Input → Dim nodes (fan-out arrows) -->
  <line x1="168" y1="164" x2="240" y2="116" stroke="#504e49" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="168" y1="188" x2="240" y2="188" stroke="#504e49" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="168" y1="212" x2="240" y2="260" stroke="#504e49" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Dim nodes → GPT Judge (fan-in arrows) -->
  <line x1="384" y1="116" x2="440" y2="152" stroke="#504e49" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="384" y1="188" x2="440" y2="188" stroke="#504e49" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="384" y1="260" x2="440" y2="224" stroke="#504e49" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- GPT Judge → Score Agg -->
  <line x1="600" y1="188" x2="664" y2="188"
        stroke="#1B365D" stroke-width="1.4" marker-end="url(#arr-b)"/>
  <rect x="600" y="176" width="56" height="13" rx="2" fill="#f5f4ed"/>
  <text x="628" y="187" fill="#1B365D" font-size="8"
        font-family="'JetBrains Mono','SF Mono',Consolas,monospace"
        text-anchor="middle" letter-spacing="0.08em">评分输出</text>

  <!-- Score Agg → output arrow -->
  <line x1="808" y1="188" x2="852" y2="188"
        stroke="#504e49" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Input node (external) -->
  <rect x="24" y="152" width="144" height="72" rx="6" fill="#f5f4ed"/>
  <rect x="24" y="152" width="144" height="72" rx="6"
        fill="rgba(94,93,89,0.08)" stroke="#6b6a64" stroke-width="1"/>
  <text x="40" y="168" fill="#6b6a64" font-size="7"
        font-family="'JetBrains Mono','SF Mono',Consolas,monospace" letter-spacing="0.15em">INPUT</text>
  <text x="96" y="188" fill="#141413" font-size="12" font-weight="600"
        font-family="Charter,Georgia,'Source Han Serif SC',serif" text-anchor="middle">项目摘要</text>
  <text x="96" y="204" fill="#504e49" font-size="9"
        font-family="Charter,Georgia,'Source Han Serif SC',serif" text-anchor="middle">+ 参考素材</text>

  <!-- Dimension node 1 -->
  <rect x="240" y="96" width="144" height="40" rx="6" fill="#ffffff" stroke="#141413" stroke-width="1"/>
  <text x="256" y="112" fill="#504e49" font-size="7"
        font-family="'JetBrains Mono','SF Mono',Consolas,monospace" letter-spacing="0.12em">DIM × 1.5</text>
  <text x="312" y="128" fill="#141413" font-size="11" font-weight="600"
        font-family="Charter,Georgia,'Source Han Serif SC',serif" text-anchor="middle">去重合并质量</text>

  <!-- Dimension node 2 -->
  <rect x="240" y="168" width="144" height="40" rx="6" fill="#ffffff" stroke="#141413" stroke-width="1"/>
  <text x="256" y="184" fill="#504e49" font-size="7"
        font-family="'JetBrains Mono','SF Mono',Consolas,monospace" letter-spacing="0.12em">DIM × 1.0</text>
  <text x="312" y="200" fill="#141413" font-size="11" font-weight="600"
        font-family="Charter,Georgia,'Source Han Serif SC',serif" text-anchor="middle">准确性 / 完整性</text>

  <!-- Dimension node 3 -->
  <rect x="240" y="240" width="144" height="40" rx="6" fill="#ffffff" stroke="#141413" stroke-width="1"/>
  <text x="256" y="256" fill="#504e49" font-size="7"
        font-family="'JetBrains Mono','SF Mono',Consolas,monospace" letter-spacing="0.12em">DIM × 1.2</text>
  <text x="312" y="272" fill="#141413" font-size="11" font-weight="600"
        font-family="Charter,Georgia,'Source Han Serif SC',serif" text-anchor="middle">结构清晰度</text>

  <!-- "· · · 共 8 个维度" label -->
  <text x="312" y="302" fill="#6b6a64" font-size="9"
        font-family="'JetBrains Mono','SF Mono',Consolas,monospace"
        text-anchor="middle" letter-spacing="0.1em">· · · 共 8 个评测维度 · 并行执行</text>

  <!-- GPT Judge (FOCAL) -->
  <rect x="440" y="132" width="160" height="112" rx="6" fill="#f5f4ed"/>
  <rect x="440" y="132" width="160" height="112" rx="6"
        fill="#EEF2F7" stroke="#1B365D" stroke-width="1.4"/>
  <text x="456" y="148" fill="#1B365D" font-size="7"
        font-family="'JetBrains Mono','SF Mono',Consolas,monospace" letter-spacing="0.15em">LLM JUDGE · FOCAL</text>
  <text x="520" y="168" fill="#141413" font-size="12" font-weight="600"
        font-family="Charter,Georgia,'Source Han Serif SC',serif" text-anchor="middle">GPT-5.1 Judge</text>
  <text x="520" y="184" fill="#504e49" font-size="9"
        font-family="'JetBrains Mono','SF Mono',Consolas,monospace" text-anchor="middle">N = 8 次采样</text>
  <text x="520" y="200" fill="#504e49" font-size="9"
        font-family="'JetBrains Mono','SF Mono',Consolas,monospace" text-anchor="middle">temperature 0.7</text>
  <text x="520" y="216" fill="#504e49" font-size="9"
        font-family="'JetBrains Mono','SF Mono',Consolas,monospace" text-anchor="middle">强制 JSON 输出</text>
  <text x="520" y="232" fill="#504e49" font-size="9"
        font-family="'JetBrains Mono','SF Mono',Consolas,monospace" text-anchor="middle">取均值降随机性</text>

  <!-- Score Aggregation (store) -->
  <rect x="664" y="152" width="144" height="72" rx="6" fill="#f5f4ed"/>
  <rect x="664" y="152" width="144" height="72" rx="6"
        fill="rgba(20,20,19,0.05)" stroke="#504e49" stroke-width="1"/>
  <text x="680" y="168" fill="#504e49" font-size="7"
        font-family="'JetBrains Mono','SF Mono',Consolas,monospace" letter-spacing="0.15em">SCORE</text>
  <text x="736" y="188" fill="#141413" font-size="12" font-weight="600"
        font-family="Charter,Georgia,'Source Han Serif SC',serif" text-anchor="middle">加权聚合</text>
  <text x="736" y="204" fill="#504e49" font-size="9"
        font-family="Charter,Georgia,'Source Han Serif SC',serif" text-anchor="middle">各维度均值 × 权重</text>
  <text x="736" y="218" fill="#504e49" font-size="9"
        font-family="Charter,Georgia,'Source Han Serif SC',serif" text-anchor="middle">→ 可对比总分</text>

  <!-- Output label -->
  <text x="858" y="184" fill="#504e49" font-size="9"
        font-family="'JetBrains Mono','SF Mono',Consolas,monospace"
        text-anchor="start" letter-spacing="0.08em">总分</text>

  <!-- Legend -->
  <line x1="24" y1="320" x2="856" y2="320" stroke="rgba(20,20,19,0.10)" stroke-width="0.8"/>
  <text x="24" y="336" fill="#504e49" font-size="8"
        font-family="'JetBrains Mono','SF Mono',Consolas,monospace" letter-spacing="0.22em">LEGEND</text>
  <rect x="124" y="328" width="14" height="10" rx="2" fill="#EEF2F7" stroke="#1B365D" stroke-width="1"/>
  <text x="144" y="336" fill="#504e49" font-size="8.5"
        font-family="Charter,Georgia,'Source Han Serif SC',serif">LLM Judge（关键节点）</text>
  <rect x="364" y="328" width="14" height="10" rx="2" fill="#ffffff" stroke="#141413" stroke-width="1"/>
  <text x="384" y="336" fill="#504e49" font-size="8.5"
        font-family="Charter,Georgia,'Source Han Serif SC',serif">评测维度（ThreadPoolExecutor 并行）</text>
  <rect x="668" y="328" width="14" height="10" rx="2" fill="rgba(20,20,19,0.05)" stroke="#504e49" stroke-width="1"/>
  <text x="688" y="336" fill="#504e49" font-size="8.5"
        font-family="Charter,Georgia,'Source Han Serif SC',serif">分数聚合</text>
</svg>
