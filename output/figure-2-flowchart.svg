<svg viewBox="0 0 860 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#504e49"/>
    </marker>
    <marker id="arr-b" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1B365D"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#f5f4ed"/>

  <!-- Start → 预处理 -->
  <line x1="430" y1="72" x2="430" y2="100"
        stroke="#504e49" stroke-width="1.2" marker-end="url(#arr)"/>
  <!-- 预处理 → decision -->
  <line x1="430" y1="148" x2="430" y2="204"
        stroke="#504e49" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- decision → ONE-PASS (left, < 60K) -->
  <path d="M 344,232 L 180,232 L 180,332"
        fill="none" stroke="#504e49" stroke-width="1.2" marker-end="url(#arr)"/>
  <rect x="236" y="222" width="52" height="14" rx="2" fill="#f5f4ed"/>
  <text x="262" y="233" fill="#504e49" font-size="8"
        font-family="'JetBrains Mono','SF Mono',Consolas,monospace"
        text-anchor="middle" letter-spacing="0.12em">&lt; 60K</text>

  <!-- decision → MAP-REDUCE (right, > 60K) -->
  <path d="M 516,232 L 684,232 L 684,332"
        fill="none" stroke="#1B365D" stroke-width="1.4" marker-end="url(#arr-b)"/>
  <rect x="574" y="222" width="52" height="14" rx="2" fill="#f5f4ed"/>
  <text x="600" y="233" fill="#1B365D" font-size="8"
        font-family="'JetBrains Mono','SF Mono',Consolas,monospace"
        text-anchor="middle" letter-spacing="0.12em">&gt; 60K</text>

  <!-- ONE-PASS → review -->
  <path d="M 180,380 L 180,476 L 360,476"
        fill="none" stroke="#504e49" stroke-width="1.2" marker-end="url(#arr)"/>
  <!-- MAP-REDUCE → review -->
  <path d="M 684,396 L 684,476 L 500,476"
        fill="none" stroke="#504e49" stroke-width="1.2" marker-end="url(#arr)"/>
  <!-- review → End -->
  <line x1="430" y1="500" x2="430" y2="520"
        stroke="#504e49" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Start pill -->
  <rect x="360" y="40" width="140" height="32" rx="16"
        fill="rgba(94,93,89,0.08)" stroke="#6b6a64" stroke-width="1"/>
  <text x="430" y="60" fill="#141413" font-size="11"
        font-family="Charter,Georgia,'Source Han Serif SC',serif" text-anchor="middle">开始</text>

  <!-- 预处理 & 规划 -->
  <rect x="360" y="100" width="140" height="48" rx="6"
        fill="#ffffff" stroke="#141413" stroke-width="1"/>
  <text x="376" y="116" fill="#504e49" font-size="7"
        font-family="'JetBrains Mono','SF Mono',Consolas,monospace" letter-spacing="0.15em">步骤 1–3</text>
  <text x="430" y="136" fill="#141413" font-size="12" font-weight="600"
        font-family="Charter,Georgia,'Source Han Serif SC',serif" text-anchor="middle">预处理 &amp; 规划</text>

  <!-- Decision diamond (FOCAL): 总量 > 60K? -->
  <polygon points="430,204 516,232 430,260 344,232"
           fill="#EEF2F7" stroke="#1B365D" stroke-width="1.4"/>
  <text x="430" y="228" fill="#141413" font-size="11" font-weight="600"
        font-family="Charter,Georgia,'Source Han Serif SC',serif" text-anchor="middle">总量 &gt; 60K?</text>
  <text x="430" y="246" fill="#1B365D" font-size="7"
        font-family="'JetBrains Mono','SF Mono',Consolas,monospace"
        text-anchor="middle" letter-spacing="0.15em">ROUTE</text>

  <!-- ONE-PASS (路径 A) -->
  <rect x="108" y="332" width="144" height="48" rx="6"
        fill="#ffffff" stroke="#141413" stroke-width="1"/>
  <text x="124" y="348" fill="#504e49" font-size="7"
        font-family="'JetBrains Mono','SF Mono',Consolas,monospace" letter-spacing="0.15em">路径 A</text>
  <text x="180" y="364" fill="#141413" font-size="12" font-weight="600"
        font-family="Charter,Georgia,'Source Han Serif SC',serif" text-anchor="middle">ONE-PASS</text>
  <text x="180" y="376" fill="#504e49" font-size="9"
        font-family="Charter,Georgia,'Source Han Serif SC',serif" text-anchor="middle">一次性生成</text>

  <!-- MAP-REDUCE (路径 B) -->
  <rect x="612" y="332" width="144" height="64" rx="6"
        fill="rgba(20,20,19,0.03)" stroke="rgba(20,20,19,0.30)" stroke-width="1"/>
  <text x="628" y="348" fill="#6b6a64" font-size="7"
        font-family="'JetBrains Mono','SF Mono',Consolas,monospace" letter-spacing="0.15em">路径 B</text>
  <text x="684" y="364" fill="#141413" font-size="12" font-weight="600"
        font-family="Charter,Georgia,'Source Han Serif SC',serif" text-anchor="middle">MAP-REDUCE</text>
  <text x="684" y="380" fill="#504e49" font-size="9"
        font-family="Charter,Georgia,'Source Han Serif SC',serif" text-anchor="middle">子 Agent · 并行</text>
  <text x="684" y="392" fill="#504e49" font-size="9"
        font-family="Charter,Georgia,'Source Han Serif SC',serif" text-anchor="middle">Map → Reduce → 组装</text>

  <!-- review (步骤 5) -->
  <rect x="360" y="452" width="140" height="48" rx="6"
        fill="#ffffff" stroke="#141413" stroke-width="1"/>
  <text x="376" y="468" fill="#504e49" font-size="7"
        font-family="'JetBrains Mono','SF Mono',Consolas,monospace" letter-spacing="0.15em">步骤 5</text>
  <text x="430" y="488" fill="#141413" font-size="12" font-weight="600"
        font-family="Charter,Georgia,'Source Han Serif SC',serif" text-anchor="middle">终审润色</text>

  <!-- End pill -->
  <rect x="360" y="520" width="140" height="32" rx="16"
        fill="rgba(94,93,89,0.08)" stroke="#6b6a64" stroke-width="1"/>
  <text x="430" y="540" fill="#141413" font-size="11"
        font-family="Charter,Georgia,'Source Han Serif SC',serif" text-anchor="middle">完成</text>

  <!-- Legend -->
  <line x1="40" y1="560" x2="820" y2="560" stroke="rgba(20,20,19,0.10)" stroke-width="0.8"/>
  <text x="40" y="576" fill="#504e49" font-size="8"
        font-family="'JetBrains Mono','SF Mono',Consolas,monospace" letter-spacing="0.22em">LEGEND</text>
  <polygon points="190,568 202,576 190,584 178,576" fill="#EEF2F7" stroke="#1B365D" stroke-width="1"/>
  <text x="212" y="580" fill="#504e49" font-size="8.5"
        font-family="Charter,Georgia,'Source Han Serif SC',serif">路由决策（关键）</text>
  <rect x="380" y="570" width="12" height="10" rx="2" fill="#ffffff" stroke="#141413" stroke-width="1"/>
  <text x="398" y="578" fill="#504e49" font-size="8.5"
        font-family="Charter,Georgia,'Source Han Serif SC',serif">处理步骤</text>
  <rect x="488" y="570" width="12" height="10" rx="2"
        fill="rgba(20,20,19,0.03)" stroke="rgba(20,20,19,0.30)" stroke-width="1"/>
  <text x="506" y="578" fill="#504e49" font-size="8.5"
        font-family="Charter,Georgia,'Source Han Serif SC',serif">大内容路径</text>
  <rect x="616" y="570" width="12" height="10" rx="16"
        fill="rgba(94,93,89,0.08)" stroke="#6b6a64" stroke-width="1"/>
  <text x="634" y="578" fill="#504e49" font-size="8.5"
        font-family="Charter,Georgia,'Source Han Serif SC',serif">开始 / 结束</text>
</svg>
