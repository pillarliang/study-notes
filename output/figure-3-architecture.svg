<svg viewBox="0 0 840 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(20,20,19,0.08)"/>
    </pattern>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#504e49"/>
    </marker>
    <marker id="arr-b" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1B365D"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#f5f4ed"/>
  <rect width="100%" height="100%" fill="url(#dots)" opacity="0.45"/>

  <!-- Main Agent → SummaryState (write, top channel) -->
  <line x1="224" y1="192" x2="360" y2="192"
        stroke="#504e49" stroke-width="1.2" marker-end="url(#arr)"/>
  <rect x="254" y="180" width="48" height="13" rx="2" fill="#f5f4ed"/>
  <text x="278" y="191" fill="#504e49" font-size="8"
        font-family="'JetBrains Mono','SF Mono',Consolas,monospace"
        text-anchor="middle" letter-spacing="0.1em">写 State</text>

  <!-- SummaryState → Main Agent (read, bottom channel) -->
  <line x1="360" y1="212" x2="224" y2="212"
        stroke="#504e49" stroke-width="1.0" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <rect x="254" y="216" width="48" height="13" rx="2" fill="#f5f4ed"/>
  <text x="278" y="227" fill="#504e49" font-size="8"
        font-family="'JetBrains Mono','SF Mono',Consolas,monospace"
        text-anchor="middle" letter-spacing="0.1em">读 State</text>

  <!-- Main Agent → Sub Agent (delegate, brand dashed) -->
  <line x1="152" y1="224" x2="152" y2="300"
        stroke="#1B365D" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arr-b)"/>
  <rect x="156" y="252" width="56" height="13" rx="2" fill="#f5f4ed"/>
  <text x="184" y="263" fill="#1B365D" font-size="8"
        font-family="'JetBrains Mono','SF Mono',Consolas,monospace"
        text-anchor="middle" letter-spacing="0.1em">委托执行</text>

  <!-- Sub Agent → SummaryState (write results, diagonal) -->
  <line x1="224" y1="332" x2="360" y2="268"
        stroke="#504e49" stroke-width="1.2" marker-end="url(#arr)"/>
  <rect x="258" y="304" width="56" height="13" rx="2" fill="#f5f4ed"/>
  <text x="286" y="315" fill="#504e49" font-size="8"
        font-family="'JetBrains Mono','SF Mono',Consolas,monospace"
        text-anchor="middle" letter-spacing="0.1em">写结果</text>

  <!-- SummaryState → 规划工具 -->
  <line x1="520" y1="200" x2="644" y2="160"
        stroke="#504e49" stroke-width="1.0" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <!-- SummaryState → 生成工具 -->
  <line x1="520" y1="240" x2="644" y2="292"
        stroke="#504e49" stroke-width="1.0" stroke-dasharray="4,3" marker-end="url(#arr)"/>

  <!-- 规划工具 → SummaryState (tool writes back) -->
  <line x1="644" y1="148" x2="520" y2="192"
        stroke="#504e49" stroke-width="1.2" marker-end="url(#arr)"/>
  <!-- 生成工具 → SummaryState -->
  <line x1="644" y1="304" x2="520" y2="252"
        stroke="#504e49" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Main Agent (FOCAL) -->
  <rect x="80" y="176" width="144" height="48" rx="6" fill="#f5f4ed"/>
  <rect x="80" y="176" width="144" height="48" rx="6"
        fill="#EEF2F7" stroke="#1B365D" stroke-width="1.4"/>
  <text x="96" y="192" fill="#1B365D" font-size="7"
        font-family="'JetBrains Mono','SF Mono',Consolas,monospace" letter-spacing="0.15em">MAIN · FOCAL</text>
  <text x="152" y="208" fill="#141413" font-size="12" font-weight="600"
        font-family="Charter,Georgia,'Source Han Serif SC',serif" text-anchor="middle">主 Agent</text>

  <!-- Sub Agent (cloud) -->
  <rect x="80" y="300" width="144" height="64" rx="6" fill="#f5f4ed"/>
  <rect x="80" y="300" width="144" height="64" rx="6"
        fill="rgba(20,20,19,0.03)" stroke="rgba(20,20,19,0.30)" stroke-width="1"/>
  <text x="96" y="316" fill="#6b6a64" font-size="7"
        font-family="'JetBrains Mono','SF Mono',Consolas,monospace" letter-spacing="0.15em">SUB AGENT</text>
  <text x="152" y="336" fill="#141413" font-size="12" font-weight="600"
        font-family="Charter,Georgia,'Source Han Serif SC',serif" text-anchor="middle">子 Agent</text>
  <text x="152" y="352" fill="#504e49" font-size="9"
        font-family="Charter,Georgia,'Source Han Serif SC',serif" text-anchor="middle">MAP-REDUCE 专用</text>

  <!-- SummaryState (store) -->
  <rect x="360" y="168" width="160" height="112" rx="6" fill="#f5f4ed"/>
  <rect x="360" y="168" width="160" height="112" rx="6"
        fill="rgba(20,20,19,0.05)" stroke="#504e49" stroke-width="1"/>
  <text x="376" y="184" fill="#504e49" font-size="7"
        font-family="'JetBrains Mono','SF Mono',Consolas,monospace" letter-spacing="0.15em">SHARED STATE</text>
  <text x="440" y="204" fill="#141413" font-size="12" font-weight="600"
        font-family="Charter,Georgia,'Source Han Serif SC',serif" text-anchor="middle">SummaryState</text>
  <text x="440" y="220" fill="#504e49" font-size="8"
        font-family="'JetBrains Mono','SF Mono',Consolas,monospace" text-anchor="middle">file_infos · files_relationship</text>
  <text x="440" y="236" fill="#504e49" font-size="8"
        font-family="'JetBrains Mono','SF Mono',Consolas,monospace" text-anchor="middle">structure_planner · rag_queries</text>
  <text x="440" y="252" fill="#504e49" font-size="8"
        font-family="'JetBrains Mono','SF Mono',Consolas,monospace" text-anchor="middle">extracted_sections · final_summary</text>
  <text x="440" y="268" fill="#504e49" font-size="8"
        font-family="'JetBrains Mono','SF Mono',Consolas,monospace" text-anchor="middle">tool_call_counts</text>

  <!-- 规划工具组 -->
  <rect x="644" y="128" width="144" height="48" rx="6" fill="#f5f4ed"/>
  <rect x="644" y="128" width="144" height="48" rx="6"
        fill="#ffffff" stroke="#141413" stroke-width="1"/>
  <text x="660" y="144" fill="#504e49" font-size="7"
        font-family="'JetBrains Mono','SF Mono',Consolas,monospace" letter-spacing="0.15em">TOOLS</text>
  <text x="716" y="160" fill="#141413" font-size="12" font-weight="600"
        font-family="Charter,Georgia,'Source Han Serif SC',serif" text-anchor="middle">规划工具组</text>

  <!-- 生成工具组 -->
  <rect x="644" y="272" width="144" height="48" rx="6" fill="#f5f4ed"/>
  <rect x="644" y="272" width="144" height="48" rx="6"
        fill="#ffffff" stroke="#141413" stroke-width="1"/>
  <text x="660" y="288" fill="#504e49" font-size="7"
        font-family="'JetBrains Mono','SF Mono',Consolas,monospace" letter-spacing="0.15em">TOOLS</text>
  <text x="716" y="304" fill="#141413" font-size="12" font-weight="600"
        font-family="Charter,Georgia,'Source Han Serif SC',serif" text-anchor="middle">生成工具组</text>

  <!-- Legend -->
  <line x1="40" y1="368" x2="800" y2="368" stroke="rgba(20,20,19,0.10)" stroke-width="0.8"/>
  <text x="40" y="384" fill="#504e49" font-size="8"
        font-family="'JetBrains Mono','SF Mono',Consolas,monospace" letter-spacing="0.22em">LEGEND</text>
  <rect x="140" y="376" width="14" height="10" rx="2" fill="#EEF2F7" stroke="#1B365D" stroke-width="1"/>
  <text x="160" y="384" fill="#504e49" font-size="8.5"
        font-family="Charter,Georgia,'Source Han Serif SC',serif">主 Agent（关键节点）</text>
  <rect x="340" y="376" width="14" height="10" rx="2" fill="rgba(20,20,19,0.05)" stroke="#504e49" stroke-width="1"/>
  <text x="360" y="384" fill="#504e49" font-size="8.5"
        font-family="Charter,Georgia,'Source Han Serif SC',serif">共享 State</text>
  <rect x="456" y="376" width="14" height="10" rx="2"
        fill="rgba(20,20,19,0.03)" stroke="rgba(20,20,19,0.30)" stroke-width="1"/>
  <text x="476" y="384" fill="#504e49" font-size="8.5"
        font-family="Charter,Georgia,'Source Han Serif SC',serif">子 Agent（独立 context）</text>
  <line x1="660" y1="382" x2="692" y2="382" stroke="#1B365D" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arr-b)"/>
  <text x="700" y="386" fill="#504e49" font-size="8.5"
        font-family="Charter,Georgia,'Source Han Serif SC',serif">委托</text>
</svg>
