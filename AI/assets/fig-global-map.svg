<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1100" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker><marker id="arg" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#0d9488"/></marker><marker id="ab" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2563eb"/></marker><marker id="mo" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#ea580c"/></marker><marker id="mb" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2563eb"/></marker></defs>
<rect width="1200" height="1100" fill="#ffffff"/>
<text x="600.0" y="44" font-size="21" fill="#0f172a" font-weight="bold" text-anchor="middle">ROLL 与 ROCK 全局心智地图：用 RL 训练 LLM 的训练引擎 + 环境工厂</text>
<text x="50" y="92" font-size="16" fill="#1d4ed8" font-weight="bold" text-anchor="start">① 为什么训 LLM 走向 RL —— 反馈越来越稀疏、越贴近真实目标（§2.3）</text>
<rect x="50" y="108" width="258" height="62" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="179.0" y="135" font-size="17" fill="#1e3a8a" font-weight="bold" text-anchor="middle">SFT</text>
<text x="179.0" y="157" font-size="13" fill="#475569" font-weight="normal" text-anchor="middle">照抄标准答案</text>
<line x1="308" y1="139" x2="350" y2="139" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="350" y="108" width="258" height="62" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="479.0" y="135" font-size="17" fill="#1e3a8a" font-weight="bold" text-anchor="middle">RLHF</text>
<text x="479.0" y="157" font-size="13" fill="#475569" font-weight="normal" text-anchor="middle">学人类偏好</text>
<line x1="608" y1="139" x2="650" y2="139" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="650" y="108" width="258" height="62" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="779.0" y="135" font-size="17" fill="#1e3a8a" font-weight="bold" text-anchor="middle">RLVR</text>
<text x="779.0" y="157" font-size="13" fill="#475569" font-weight="normal" text-anchor="middle">程序判对错</text>
<line x1="908" y1="139" x2="950" y2="139" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="950" y="108" width="258" height="62" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="1079.0" y="135" font-size="17" fill="#1e3a8a" font-weight="bold" text-anchor="middle">Agentic</text>
<text x="1079.0" y="157" font-size="13" fill="#475569" font-weight="normal" text-anchor="middle">环境多轮交互</text>
<text x="50" y="218" font-size="16" fill="#c2410c" font-weight="bold" text-anchor="start">② RL 怎么学会（核心机制，§2.2）—— 把 reward 变成对模型的一次更新</text>
<rect x="50" y="234" width="258" height="82" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
<text x="179.0" y="266" font-size="16" fill="#9a3412" font-weight="bold" text-anchor="middle">生成回答</text>
<text x="179.0" y="292" font-size="12.5" fill="#475569" font-weight="normal" text-anchor="middle">当前模型产出 rollout</text>
<line x1="308" y1="275" x2="350" y2="275" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="350" y="234" width="258" height="82" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
<text x="479.0" y="266" font-size="16" fill="#9a3412" font-weight="bold" text-anchor="middle">打分 reward</text>
<text x="479.0" y="292" font-size="12.5" fill="#475569" font-weight="normal" text-anchor="middle">0/1 或连续分</text>
<line x1="608" y1="275" x2="650" y2="275" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="650" y="234" width="258" height="82" rx="10" fill="#ffedd5" stroke="#f97316" stroke-width="1.5"/>
<text x="779.0" y="266" font-size="16" fill="#9a3412" font-weight="bold" text-anchor="middle">advantage</text>
<text x="779.0" y="292" font-size="12.5" fill="#475569" font-weight="normal" text-anchor="middle">= reward − 组平均</text>
<line x1="908" y1="275" x2="950" y2="275" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="950" y="234" width="258" height="82" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
<text x="1079.0" y="266" font-size="16" fill="#9a3412" font-weight="bold" text-anchor="middle">更新 policy</text>
<text x="1079.0" y="292" font-size="12.5" fill="#475569" font-weight="normal" text-anchor="middle">advantage 加权梯度下降</text>
<text x="50" y="342" font-size="13" fill="#7c2d12" font-weight="normal" text-anchor="start">目标是最大化 reward；advantage 不是另一个目标，只是为了更稳地逼近它而用的更新信号。</text>
<text x="50" y="386" font-size="15.5" fill="#0f172a" font-weight="bold" text-anchor="start">③ 工程难点 → 两个工具：一个训练步含三种性质相反的计算（生成 / 打分 / 更新），要在同批 GPU 上协同（§2.4 → §三 / §四）</text>
<rect x="50" y="402" width="560" height="256" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
<text x="330" y="430" font-size="17" fill="#065f46" font-weight="bold" text-anchor="middle">ROLL —— 训练引擎 / 扩展库</text>
<text x="330" y="452" font-size="12.5" fill="#047857" font-weight="normal" text-anchor="middle">把三种计算拆成可独立调度的角色 · Ray + 策略抽象</text>
<rect x="70" y="470" width="250" height="72" rx="10" fill="#ffffff" stroke="#34d399" stroke-width="1.5"/>
<text x="195" y="500" font-size="13.5" fill="#065f46" font-weight="bold" text-anchor="middle">生成 / 训练后端</text>
<text x="195" y="522" font-size="11" fill="#475569" font-weight="normal" text-anchor="middle">vLLM·SGLang / FSDP2·Megatron</text>
<rect x="340" y="470" width="250" height="72" rx="10" fill="#ffffff" stroke="#34d399" stroke-width="1.5"/>
<text x="465" y="500" font-size="13.5" fill="#065f46" font-weight="bold" text-anchor="middle">单机 → 上千卡</text>
<text x="465" y="522" font-size="11" fill="#475569" font-weight="normal" text-anchor="middle">同一份代码不用改</text>
<rect x="70" y="558" width="250" height="72" rx="10" fill="#ffffff" stroke="#34d399" stroke-width="1.5"/>
<text x="195" y="588" font-size="13.5" fill="#065f46" font-weight="bold" text-anchor="middle">RL 算法</text>
<text x="195" y="610" font-size="11" fill="#475569" font-weight="normal" text-anchor="middle">PPO·GRPO·GSPO·StarPO·GiGPO</text>
<rect x="340" y="558" width="250" height="72" rx="10" fill="#ffffff" stroke="#34d399" stroke-width="1.5"/>
<text x="465" y="588" font-size="13.5" fill="#065f46" font-weight="bold" text-anchor="middle">五种 pipeline</text>
<text x="465" y="610" font-size="11" fill="#475569" font-weight="normal" text-anchor="middle">SFT·DPO·RLVR·Agentic·Distill</text>
<rect x="640" y="402" width="510" height="256" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="895" y="430" font-size="17" fill="#5b21b6" font-weight="bold" text-anchor="middle">ROCK —— 环境工厂（仅 agentic）</text>
<text x="895" y="452" font-size="12.5" fill="#6d28d9" font-weight="normal" text-anchor="middle">扮演 RL 回路里的 environment · 沙箱管理</text>
<rect x="660" y="470" width="225" height="72" rx="10" fill="#ffffff" stroke="#a78bfa" stroke-width="1.5"/>
<text x="772" y="500" font-size="13.5" fill="#5b21b6" font-weight="bold" text-anchor="middle">Admin</text>
<text x="772" y="522" font-size="11" fill="#475569" font-weight="normal" text-anchor="middle">中央调度 · 分配沙箱</text>
<rect x="905" y="470" width="225" height="72" rx="10" fill="#ffffff" stroke="#a78bfa" stroke-width="1.5"/>
<text x="1017" y="500" font-size="13.5" fill="#5b21b6" font-weight="bold" text-anchor="middle">Worker</text>
<text x="1017" y="522" font-size="11" fill="#475569" font-weight="normal" text-anchor="middle">执行节点 · 提供算力</text>
<rect x="660" y="558" width="225" height="72" rx="10" fill="#ffffff" stroke="#a78bfa" stroke-width="1.5"/>
<text x="772" y="588" font-size="13.5" fill="#5b21b6" font-weight="bold" text-anchor="middle">Rocklet</text>
<text x="772" y="610" font-size="11" fill="#475569" font-weight="normal" text-anchor="middle">SDK ↔ 沙箱 通信代理</text>
<rect x="905" y="558" width="225" height="72" rx="10" fill="#ffffff" stroke="#a78bfa" stroke-width="1.5"/>
<text x="1017" y="588" font-size="13.5" fill="#5b21b6" font-weight="bold" text-anchor="middle">接口 / 协议</text>
<text x="1017" y="610" font-size="11" fill="#475569" font-weight="normal" text-anchor="middle">make/reset/step · GEM/Bash/Chat</text>
<text x="50" y="706" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">④ Agentic 闭环：ROLL 与 ROCK 协作的一个训练步（§五）</text>
<rect x="160" y="734" width="330" height="80" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
<text x="325.0" y="768" font-size="15" fill="#065f46" font-weight="bold" text-anchor="middle">ROLL 生成动作</text>
<text x="325.0" y="792" font-size="12" fill="#475569" font-weight="normal" text-anchor="middle">推理引擎输出 action</text>
<rect x="720" y="734" width="330" height="80" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="885.0" y="768" font-size="15" fill="#5b21b6" font-weight="bold" text-anchor="middle">ROCK 沙箱执行</text>
<text x="885.0" y="792" font-size="12" fill="#475569" font-weight="normal" text-anchor="middle">隔离 Worker 上跑 action</text>
<rect x="720" y="914" width="330" height="80" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="885.0" y="948" font-size="15" fill="#5b21b6" font-weight="bold" text-anchor="middle">返回 observation + reward</text>
<text x="885.0" y="972" font-size="12" fill="#475569" font-weight="normal" text-anchor="middle">新观测与奖励</text>
<rect x="160" y="914" width="330" height="80" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
<text x="325.0" y="948" font-size="15" fill="#065f46" font-weight="bold" text-anchor="middle">ROLL 更新参数</text>
<text x="325.0" y="972" font-size="12" fill="#475569" font-weight="normal" text-anchor="middle">按 advantage 更新 policy</text>
<line x1="490" y1="774" x2="720" y2="774" stroke="#0d9488" stroke-width="2.2" marker-end="url(#arg)"/>
<text x="605" y="762" font-size="12.5" fill="#0d9488" font-weight="bold" text-anchor="middle">send action</text>
<line x1="885" y1="814" x2="885" y2="914" stroke="#0d9488" stroke-width="2.2" marker-end="url(#arg)"/>
<text x="1035" y="866" font-size="12.5" fill="#7c3aed" font-weight="bold" text-anchor="end">env.step()</text>
<line x1="720" y1="954" x2="490" y2="954" stroke="#0d9488" stroke-width="2.2" marker-end="url(#arg)"/>
<text x="605" y="946" font-size="12.5" fill="#0d9488" font-weight="bold" text-anchor="middle">trajectory + reward</text>
<line x1="325" y1="914" x2="325" y2="814" stroke="#0d9488" stroke-width="2.2" marker-end="url(#arg)"/>
<text x="180" y="866" font-size="12.5" fill="#0d9488" font-weight="bold" text-anchor="start">进入下一步</text>
</svg>