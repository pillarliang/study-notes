<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 600" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker><marker id="arg" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#0d9488"/></marker><marker id="ab" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2563eb"/></marker><marker id="mo" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#ea580c"/></marker><marker id="mb" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2563eb"/></marker></defs>
<rect width="1020" height="600" fill="#ffffff"/>
<text x="510.0" y="38" font-size="18" fill="#0f172a" font-weight="bold" text-anchor="middle">ROCK 架构：Admin 是控制面，Worker 是执行节点，Rocklet 在 Worker 内代理数据交互</text>
<rect x="60" y="80" width="260" height="96" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="190" y="118" font-size="16" fill="#1e3a8a" font-weight="bold" text-anchor="middle">SDK / CLI（客户端）</text>
<text x="190" y="144" font-size="13" fill="#475569" font-weight="normal" text-anchor="middle">训练框架在这里发起调用</text>
<rect x="700" y="80" width="260" height="96" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="830" y="118" font-size="16" fill="#9a3412" font-weight="bold" text-anchor="middle">Admin（控制面）</text>
<text x="830" y="144" font-size="13" fill="#475569" font-weight="normal" text-anchor="middle">中央调度、分配沙箱资源</text>
<rect x="316" y="316" width="540" height="232" rx="12" fill="#f0fdf4" stroke="#a7f3d0" stroke-width="1.5"/>
<rect x="300" y="300" width="540" height="232" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
<text x="570" y="330" font-size="15" fill="#065f46" font-weight="bold" text-anchor="middle">Worker（执行节点 · 提供算力）  × N</text>
<rect x="330" y="360" width="170" height="140" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="415" y="418" font-size="15" fill="#5b21b6" font-weight="bold" text-anchor="middle">Rocklet</text>
<text x="415" y="442" font-size="12" fill="#475569" font-weight="normal" text-anchor="middle">通信代理</text>
<text x="415" y="462" font-size="12" fill="#475569" font-weight="normal" text-anchor="middle">SDK ↔ 沙箱</text>
<rect x="560" y="362" width="250" height="48" rx="10" fill="#ffffff" stroke="#5eead4" stroke-width="1.5"/>
<text x="685" y="384" font-size="12.5" fill="#0f766e" font-weight="normal" text-anchor="middle">Sandbox 沙箱（隔离环境实例）</text>
<rect x="560" y="420" width="250" height="48" rx="10" fill="#ffffff" stroke="#5eead4" stroke-width="1.5"/>
<text x="685" y="442" font-size="12.5" fill="#0f766e" font-weight="normal" text-anchor="middle">Sandbox 沙箱（隔离环境实例）</text>
<rect x="560" y="478" width="250" height="40" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="685" y="503" font-size="12" fill="#94a3b8" font-weight="normal" text-anchor="middle">…… 更多 Sandbox</text>
<line x1="60" y1="556" x2="94" y2="556" stroke="#ea580c" stroke-width="2.4" stroke-dasharray="6,4"/>
<text x="104" y="561" font-size="13" fill="#334155" font-weight="normal" text-anchor="start">控制 / 管理路径</text>
<line x1="290" y1="556" x2="324" y2="556" stroke="#2563eb" stroke-width="2.4"/>
<text x="334" y="561" font-size="13" fill="#334155" font-weight="normal" text-anchor="start">数据交互路径（环境的 make/reset/step）</text>
<line x1="320" y1="118" x2="700" y2="118" stroke="#ea580c" stroke-width="2.4" marker-end="url(#mo)"/>
<text x="510" y="106" font-size="13" fill="#9a3412" font-weight="bold" text-anchor="middle">申请 / 释放环境</text>
<path d="M 830,176 L 830,250 L 660,250 L 660,300" fill="none" stroke="#ea580c" stroke-width="2.2" stroke-dasharray="6,4" marker-end="url(#mo)"/>
<text x="838" y="242" font-size="13" fill="#9a3412" font-weight="bold" text-anchor="middle">调度、分配沙箱</text>
<path d="M 190,176 L 190,430 L 330,430" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#mb)"/>
<text x="190" y="198" font-size="13" fill="#2563eb" font-weight="bold" text-anchor="middle">make/reset/step</text>
<line x1="500" y1="386" x2="560" y2="386" stroke="#2563eb" stroke-width="2.2" marker-end="url(#mb)"/>
<line x1="560" y1="444" x2="500" y2="444" stroke="#2563eb" stroke-width="2.2" marker-end="url(#mb)"/>
<text x="530" y="378" font-size="11.5" fill="#2563eb" font-weight="normal" text-anchor="middle">动作</text>
<text x="530" y="462" font-size="11.5" fill="#2563eb" font-weight="normal" text-anchor="middle">观测+奖励</text>
</svg>