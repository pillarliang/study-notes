<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker><marker id="arg" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#0d9488"/></marker><marker id="ab" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2563eb"/></marker><marker id="mo" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#ea580c"/></marker><marker id="mb" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2563eb"/></marker></defs>
<rect width="1000" height="400" fill="#ffffff"/>
<text x="500.0" y="40" font-size="19" fill="#0f172a" font-weight="bold" text-anchor="middle">一个 RL 训练步：生成 → 打分 → 更新，跑完回到 ① 再来一轮</text>
<rect x="40" y="80" width="250" height="160" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="165.0" y="118" font-size="17" fill="#1e3a8a" font-weight="bold" text-anchor="middle">① 生成 rollout</text>
<text x="165.0" y="152" font-size="13" fill="#475569" font-weight="normal" text-anchor="middle">当前模型生成回答</text>
<text x="165.0" y="182" font-size="13" fill="#475569" font-weight="normal" text-anchor="middle">纯推理 · 只前向</text>
<text x="165.0" y="212" font-size="13" fill="#475569" font-weight="normal" text-anchor="middle">vLLM / SGLang</text>
<rect x="375" y="80" width="250" height="160" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
<text x="500.0" y="118" font-size="17" fill="#9a3412" font-weight="bold" text-anchor="middle">② 算 reward</text>
<text x="500.0" y="152" font-size="13" fill="#475569" font-weight="normal" text-anchor="middle">给每份回答打分</text>
<text x="500.0" y="182" font-size="13" fill="#475569" font-weight="normal" text-anchor="middle">程序验证 / reward model</text>
<text x="500.0" y="212" font-size="13" fill="#475569" font-weight="normal" text-anchor="middle">规则 or 模型</text>
<rect x="710" y="80" width="250" height="160" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
<text x="835.0" y="118" font-size="17" fill="#065f46" font-weight="bold" text-anchor="middle">③ 更新参数</text>
<text x="835.0" y="152" font-size="13" fill="#475569" font-weight="normal" text-anchor="middle">按分数更新 policy</text>
<text x="835.0" y="182" font-size="13" fill="#475569" font-weight="normal" text-anchor="middle">反向传播 · 梯度下降</text>
<text x="835.0" y="212" font-size="13" fill="#475569" font-weight="normal" text-anchor="middle">FSDP2 / Megatron</text>
<line x1="290" y1="160.0" x2="375" y2="160.0" stroke="#475569" stroke-width="2.2" marker-end="url(#ar)"/>
<text x="332.5" y="148.0" font-size="14" fill="#334155" font-weight="bold" text-anchor="middle">回答</text>
<line x1="625" y1="160.0" x2="710" y2="160.0" stroke="#475569" stroke-width="2.2" marker-end="url(#ar)"/>
<text x="667.5" y="148.0" font-size="14" fill="#334155" font-weight="bold" text-anchor="middle">分数</text>
<path d="M 835.0,240 L 835.0,295 L 165.0,295 L 165.0,240" fill="none" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#arg)"/>
<text x="500.0" y="317" font-size="14" fill="#7c3aed" font-weight="bold" text-anchor="middle">用更新后的新模型，回到 ① 再来一轮</text>
</svg>