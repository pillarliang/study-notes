<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker><marker id="arg" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#0d9488"/></marker><marker id="ab" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2563eb"/></marker><marker id="mo" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#ea580c"/></marker><marker id="mb" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2563eb"/></marker></defs>
<rect width="920" height="540" fill="#ffffff"/>
<text x="460.0" y="42" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="middle">强化学习基本回路：agent 与 environment 的互动</text>
<text x="460.0" y="68" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">—— policy / trajectory / rollout / return 都挂在这个回路上</text>
<rect x="110" y="150" width="250" height="140" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="235" y="188" font-size="18" fill="#1e3a8a" font-weight="bold" text-anchor="middle">Agent 智能体</text>
<text x="235" y="218" font-size="14" fill="#2563eb" font-weight="normal" text-anchor="middle">= policy（就是模型本身）</text>
<text x="235" y="248" font-size="13" fill="#475569" font-weight="normal" text-anchor="middle">看 observation，选 action</text>
<text x="235" y="270" font-size="12" fill="#94a3b8" font-weight="normal" text-anchor="middle">训练 = 调 policy 的参数</text>
<rect x="560" y="150" width="250" height="140" rx="10" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
<text x="685" y="188" font-size="18" fill="#991b1b" font-weight="bold" text-anchor="middle">Environment 环境</text>
<text x="685" y="222" font-size="13" fill="#475569" font-weight="normal" text-anchor="middle">执行 action</text>
<text x="685" y="248" font-size="13" fill="#475569" font-weight="normal" text-anchor="middle">产生新 observation</text>
<text x="685" y="270" font-size="13" fill="#475569" font-weight="normal" text-anchor="middle">并给出 reward</text>
<path d="M 360,180 C 430,108 490,108 560,180" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#ab)"/>
<text x="460" y="104" font-size="15" fill="#2563eb" font-weight="bold" text-anchor="middle">action 动作</text>
<path d="M 560,262 C 490,334 430,334 360,262" fill="none" stroke="#059669" stroke-width="2.4" marker-end="url(#arg)"/>
<text x="460" y="352" font-size="15" fill="#059669" font-weight="bold" text-anchor="middle">observation 观测  +  reward 奖励</text>
<text x="460" y="225" font-size="13" fill="#94a3b8" font-weight="normal" text-anchor="middle">↻ 一轮接一轮</text>
<rect x="40" y="400" width="260" height="104" rx="10" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5"/>
<text x="170" y="434" font-size="16" fill="#5b21b6" font-weight="bold" text-anchor="middle">trajectory 轨迹</text>
<text x="170" y="462" font-size="12.5" fill="#475569" font-weight="normal" text-anchor="middle">一轮轮 (obs, action, reward)</text>
<text x="170" y="484" font-size="12.5" fill="#475569" font-weight="normal" text-anchor="middle">从头到尾串成的完整序列</text>
<rect x="330" y="400" width="260" height="104" rx="10" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/>
<text x="460" y="434" font-size="16" fill="#065f46" font-weight="bold" text-anchor="middle">rollout</text>
<text x="460" y="462" font-size="12.5" fill="#475569" font-weight="normal" text-anchor="middle">用当前 policy 实际跑出</text>
<text x="460" y="484" font-size="12.5" fill="#475569" font-weight="normal" text-anchor="middle">一条 trajectory 的过程</text>
<rect x="620" y="400" width="260" height="104" rx="10" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
<text x="750" y="434" font-size="16" fill="#9a3412" font-weight="bold" text-anchor="middle">return 回报</text>
<text x="750" y="462" font-size="12.5" fill="#475569" font-weight="normal" text-anchor="middle">一条 trajectory 上 reward 的总和</text>
<text x="750" y="484" font-size="12.5" fill="#475569" font-weight="normal" text-anchor="middle">← agent 的目标就是最大化它</text>
</svg>