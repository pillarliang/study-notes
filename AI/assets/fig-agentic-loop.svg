<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker><marker id="arg" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#0d9488"/></marker><marker id="ab" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2563eb"/></marker><marker id="mo" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#ea580c"/></marker><marker id="mb" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2563eb"/></marker></defs>
<rect width="1000" height="560" fill="#ffffff"/>
<text x="500.0" y="36" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="middle">Agentic 闭环：ROLL 生成动作 → ROCK 沙箱执行 → 回传 → ROLL 更新，循环往复</text>
<rect x="40" y="70" width="440" height="450" rx="16" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" stroke-dasharray="6,5"/>
<rect x="520" y="70" width="440" height="450" rx="16" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5" stroke-dasharray="6,5"/>
<text x="260" y="98" font-size="15" fill="#065f46" font-weight="bold" text-anchor="middle">ROLL（训练侧）</text>
<text x="740" y="98" font-size="15" fill="#6d28d9" font-weight="bold" text-anchor="middle">ROCK（环境侧）</text>
<rect x="110" y="130" width="300" height="120" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
<text x="260" y="170" font-size="16" fill="#065f46" font-weight="bold" text-anchor="middle">① 生成动作</text>
<text x="260" y="200" font-size="13" fill="#475569" font-weight="normal" text-anchor="middle">当前模型产出 action</text>
<text x="260" y="224" font-size="12.5" fill="#475569" font-weight="normal" text-anchor="middle">vLLM / SGLang</text>
<rect x="550" y="130" width="300" height="120" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="700" y="170" font-size="16" fill="#5b21b6" font-weight="bold" text-anchor="middle">② 沙箱执行</text>
<text x="700" y="200" font-size="13" fill="#475569" font-weight="normal" text-anchor="middle">Worker 上的环境实例</text>
<text x="700" y="224" font-size="12.5" fill="#475569" font-weight="normal" text-anchor="middle">跑这个 action</text>
<rect x="550" y="360" width="300" height="120" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="700" y="400" font-size="16" fill="#5b21b6" font-weight="bold" text-anchor="middle">③ 返回结果</text>
<text x="700" y="430" font-size="13" fill="#475569" font-weight="normal" text-anchor="middle">observation + reward</text>
<text x="700" y="454" font-size="12.5" fill="#475569" font-weight="normal" text-anchor="middle">+ done</text>
<rect x="110" y="360" width="300" height="120" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
<text x="260" y="400" font-size="16" fill="#065f46" font-weight="bold" text-anchor="middle">④ 算 advantage + 更新参数</text>
<text x="260" y="430" font-size="13" fill="#475569" font-weight="normal" text-anchor="middle">StarPO / GiGPO</text>
<text x="260" y="454" font-size="12.5" fill="#475569" font-weight="normal" text-anchor="middle">FSDP2 / Megatron</text>
<line x1="410" y1="190" x2="550" y2="190" stroke="#475569" stroke-width="2.4" marker-end="url(#ar)"/>
<text x="480" y="178" font-size="13" fill="#334155" font-weight="bold" text-anchor="middle">env.step(action)</text>
<line x1="700" y1="250" x2="700" y2="360" stroke="#475569" stroke-width="2.4" marker-end="url(#ar)"/>
<text x="710" y="308" font-size="13" fill="#334155" font-weight="bold" text-anchor="start">环境推进一步</text>
<line x1="550" y1="420" x2="410" y2="420" stroke="#475569" stroke-width="2.4" marker-end="url(#ar)"/>
<text x="480" y="442" font-size="13" fill="#334155" font-weight="bold" text-anchor="middle">回传 observation + reward</text>
<line x1="260" y1="360" x2="260" y2="250" stroke="#475569" stroke-width="2.4" marker-end="url(#ar)"/>
<text x="250" y="308" font-size="13" fill="#334155" font-weight="bold" text-anchor="end">更新后，进入下一步</text>
</svg>