daily-communication:
  - "Holidays and celebrations（节日与庆祝）":
      - "Major Western holidays（西方主要节日）":
          - "Christmas（圣诞节）":
              "典型元素":
                - "Christmas tree（圣诞树）"
                - "Santa Claus（圣诞老人）"
                - "gingerbread man（姜饼人）"
                - "snowman（雪人）"
              "相关表达":
                - "Christmas Eve（平安夜，12月24日）"

          - "Easter（复活节）":
              "典型元素":
                - "Easter eggs（复活节彩蛋）"

          - "Thanksgiving（感恩节）":
              "典型元素":
                - "turkey（火鸡）"

          - "Other holidays（其他节日）":
              - "Father's Day（父亲节）"
              - "Mother's Day（母亲节）"
              - "Halloween（万圣节）"
              - "Valentine's Day（情人节）"

      - "Ask about holiday plans（询问节日安排）":
          - "Do you have any plans for [holiday/time]?":
              "特性":
                - "用于询问对方在某个节日或某段时间有什么安排。"
                - "自然、常用，可替换具体节日或时间。"
              "结构":
                - "Do you have any plans for [holiday/time]?"
              "Example":
                - "Do you have any plans for Thanksgiving?"
                - "Do you have any plans for Christmas?"
                - "Do you have any plans for Easter?"

      - "Holiday greetings（节日问候）":
          - "Happy + [holiday]":
              "特性":
                - "用于向对方送上节日祝福。"
                - "节日名称通常需要大写。"
                - "圣诞节通常说 Merry Christmas，而不是 Happy Christmas。"
              "结构":
                - "Happy + [holiday]!"
              "Example":
                - "Happy Thanksgiving!"
                - "Happy Easter!"
                - "Happy New Year!"

          - "Merry Christmas! / Merry Christmas to [someone]!":
              "特性":
                - "约定俗成的圣诞节祝福，适用于口头交流和贺卡。"
                - "加上 to [someone] 可以向特定的人送上祝福，常见于圣诞贺卡。"
              "结构":
                - "Merry Christmas!"
                - "Merry Christmas to [someone]!"
              "Example":
                - "Merry Christmas!"
                - "Merry Christmas to the world's best parents!"
                - "Merry Christmas to the world's best husband!"

          - "Happy holidays!":
              "特性":
                - "用于笼统祝福对方度过愉快的节庆季。"
                - "常涵盖圣诞节、新年等临近的多个节日。"
                - "作为通用节庆季祝福时，复数 holidays 比单数 holiday 更自然。"
              "Example":
                - "Happy holidays!"

      - "Invite someone over（邀请某人来家里）":
          - "invite [someone] over":
              "特性":
                - "表示邀请某人到自己家里来。"
                - "可用于节日聚会、晚餐或普通社交场景。"
              "结构":
                - "invite [someone] over"
                - "invite [someone] over for [holiday/event]"
              "Example":
                - "I'm going to invite my friends over."
                - "I invited my cousin over for Thanksgiving."
                - "We invited some neighbors over for Christmas dinner."

      - "Express gratitude（表达感恩）":
          - "be thankful for [someone/something]":
              "特性":
                - "用于表达自己对某人、某事或某段经历的感激。"
                - "可谈论家庭、朋友、健康、工作等。"
              "结构":
                - "be thankful for [名词或动词-ing]"
              "Example":
                - "I'm thankful for having the best husband and children in the world."

      - "Offer prayers and blessings（表达祈祷与祝愿）":
          - "I'll pray for you.":
              "特性":
                - "表示会为对方祈祷，通常带有宗教色彩。"
              "结构":
                - "pray for [someone]"
              "Example":
                - "I'll pray for you."

          - "Amen.":
              "特性":
                - "常用于祷告结束时，表达认同与诚心所愿。"
              "Example":
                - "Amen."

          - "May [wish]":
              "特性":
                - "用于表达较正式、温暖的祝愿。"
                - "常见于新年、圣诞节和贺卡用语。"
              "结构":
                - "May [主语] [动词原形及其他成分]."
              "Example":
                - "May the coming year be full of many blessings."

      - "Pass on holiday greetings（转达节日祝福）":
          - "Please send my [occasion] greetings to [someone].":
              "特性":
                - "用于请对方代为向第三人转达节日问候。"
                - "可替换节日名称和收取祝福的人。"
              "结构":
                - "Please send my [occasion] greetings to [someone]."
              "Example":
                - "Please send my Christmas greetings to Brian."
                - "Please send my New Year greetings to your parents."
