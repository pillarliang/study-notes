<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
<defs>
<marker id="arr" markerWidth="11" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#2563eb"/></marker>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.12"/></filter>
</defs>
<rect x="0" y="0" width="1280" height="720" fill="#ffffff"/>
<text x="40" y="46" font-size="24" font-weight="700" fill="#0f172a">GitHub Actions：从一次 push 到 CI 自动运行</text>
<text x="40" y="74" font-size="14" fill="#64748b">核心心智模型 —— 事件驱动：仓库发生事件 → 引擎匹配 on: → 自动起 Runner → 按 Job/Step 执行 → 产出制品</text>
<rect x="40" y="100" width="210" height="360" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" filter="url(#sh)"/>
<text x="145" y="128" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="middle">① 事件 (Event)</text>
<text x="60" y="158" font-size="12" font-weight="400" fill="#475569" text-anchor="start">仓库里发生的动作：</text>
<rect x="56" y="172" width="178" height="22" rx="5" fill="#dbeafe"/>
<text x="64" y="187" font-size="12.5" font-weight="700" fill="#1d4ed8" text-anchor="start">★ push（推送代码）</text>
<text x="64" y="215" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">pull_request（PR）</text>
<text x="64" y="243" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">label（打标签）</text>
<text x="64" y="271" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">schedule（定时 cron）</text>
<text x="64" y="299" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">workflow_dispatch</text>
<text x="64" y="327" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">（手动点按钮）</text>
<text x="64" y="355" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">workflow_call</text>
<text x="64" y="383" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">（被别的流程复用）</text>
<rect x="300" y="100" width="220" height="360" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" filter="url(#sh)"/>
<text x="410" y="128" font-size="15" font-weight="700" fill="#15803d" text-anchor="middle">② Workflow 文件</text>
<text x="316" y="160" font-size="12" font-weight="600" fill="#334155" text-anchor="start">.github/workflows/</text>
<text x="316" y="180" font-size="12" font-weight="400" fill="#334155" text-anchor="start">  ci.yaml 等 *.yaml</text>
<rect x="316" y="200" width="188" height="118" rx="8" fill="#ffffff" stroke="#86efac"/>
<text x="328" y="222" font-size="12.5" font-weight="700" fill="#15803d" text-anchor="start">on:</text>
<text x="328" y="242" font-size="12" font-weight="400" fill="#334155" text-anchor="start">  push:</text>
<text x="328" y="260" font-size="12" font-weight="400" fill="#334155" text-anchor="start">    branches:</text>
<text x="328" y="278" font-size="12" font-weight="400" fill="#334155" text-anchor="start">      ["**"]</text>
<text x="328" y="300" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">= 声明「哪些事件」触发</text>
<text x="316" y="342" font-size="12" font-weight="400" fill="#475569" text-anchor="start">引擎拿事件和 on: 比对，</text>
<text x="316" y="360" font-size="12" font-weight="400" fill="#475569" text-anchor="start">命中才运行，不中就跳过。</text>
<text x="316" y="392" font-size="12" font-weight="600" fill="#334155" text-anchor="start">jobs: 里写「要做什么」</text>
<text x="316" y="410" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">（构建 / 测试 / 部署…）</text>
<rect x="570" y="100" width="190" height="360" rx="12" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5" filter="url(#sh)"/>
<text x="665" y="128" font-size="15" font-weight="700" fill="#a16207" text-anchor="middle">③ 引擎 + Runner</text>
<text x="586" y="160" font-size="12" font-weight="600" fill="#475569" text-anchor="start">GitHub 托管引擎：</text>
<text x="586" y="182" font-size="12" font-weight="400" fill="#334155" text-anchor="start">• 持续监听事件</text>
<text x="586" y="202" font-size="12" font-weight="400" fill="#334155" text-anchor="start">• 命中即调度</text>
<rect x="586" y="224" width="158" height="120" rx="8" fill="#ffffff" stroke="#fde047"/>
<text x="665" y="248" font-size="13" font-weight="700" fill="#a16207" text-anchor="middle">Runner</text>
<text x="665" y="268" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">一台临时虚拟机</text>
<text x="600" y="292" font-size="11.5" font-weight="600" fill="#334155" text-anchor="start">runs-on:</text>
<text x="600" y="310" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">ubuntu-latest</text>
<text x="600" y="330" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">或自托管 runner</text>
<text x="586" y="372" font-size="12" font-weight="400" fill="#475569" text-anchor="start">跑完即销毁，</text>
<text x="586" y="390" font-size="12" font-weight="400" fill="#475569" text-anchor="start">每次都是干净环境。</text>
<rect x="810" y="100" width="270" height="360" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="1.5" filter="url(#sh)"/>
<text x="945" y="128" font-size="15" font-weight="700" fill="#7e22ce" text-anchor="middle">④ Jobs / Steps</text>
<text x="826" y="156" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Job：并行执行单元，各占一台 Runner</text>
<rect x="826" y="170" width="238" height="126" rx="8" fill="#ffffff" stroke="#d8b4fe"/>
<text x="838" y="190" font-size="12" font-weight="700" fill="#7e22ce" text-anchor="start">job: cfg（读 ci.json）</text>
<text x="838" y="210" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">steps:  ← 顺序执行</text>
<text x="846" y="230" font-size="11" font-weight="400" fill="#334155" text-anchor="start">- uses: checkout   （复用 action）</text>
<text x="846" y="248" font-size="11" font-weight="400" fill="#334155" text-anchor="start">- run: jq …        （执行命令）</text>
<text x="838" y="272" font-size="11" font-weight="400" fill="#475569" text-anchor="start">outputs: 把结果传给下游 job</text>
<text x="838" y="290" font-size="11" font-weight="400" fill="#475569" text-anchor="start">needs: 声明依赖 → 串行</text>
<rect x="826" y="306" width="238" height="120" rx="8" fill="#ffffff" stroke="#d8b4fe"/>
<text x="838" y="326" font-size="12" font-weight="700" fill="#7e22ce" text-anchor="start">job: ci（构建镜像）</text>
<text x="838" y="346" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">uses: 复用外部 workflow</text>
<text x="838" y="364" font-size="11" font-weight="400" fill="#334155" text-anchor="start">docker build -f Dockerfile</text>
<text x="838" y="382" font-size="11" font-weight="400" fill="#334155" text-anchor="start">docker push  ecr:&lt;sha7&gt;</text>
<text x="838" y="404" font-size="11" font-weight="400" fill="#475569" text-anchor="start">secrets: inherit 传凭证</text>
<text x="826" y="446" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">job 间默认并行；needs 让它们排队</text>
<rect x="1130" y="100" width="120" height="360" rx="12" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5" filter="url(#sh)"/>
<text x="1190" y="128" font-size="15" font-weight="700" fill="#be123c" text-anchor="middle">⑤ 产物</text>
<text x="1190" y="168" font-size="12.5" font-weight="600" fill="#334155" text-anchor="middle">镜像</text>
<rect x="1144" y="182" width="92" height="40" rx="6" fill="#ffffff" stroke="#fda4af"/>
<text x="1190" y="200" font-size="10.5" font-weight="400" fill="#334155" text-anchor="middle">ecr 地址</text>
<text x="1190" y="215" font-size="11" font-weight="700" fill="#be123c" text-anchor="middle">:&lt;sha7&gt;</text>
<text x="1190" y="252" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">↓ 手工/自动</text>
<text x="1190" y="286" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">deploy 仓库</text>
<text x="1190" y="306" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">填入 tag</text>
<text x="1190" y="346" font-size="14" font-weight="400" fill="#64748b" text-anchor="middle">↓</text>
<text x="1190" y="376" font-size="12.5" font-weight="700" fill="#be123c" text-anchor="middle">部署上线</text>
<line x1="250" y1="280" x2="296" y2="280" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arr)"/>
<text x="275" y="272" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="600">触发</text>
<line x1="520" y1="280" x2="566" y2="280" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arr)"/>
<text x="545" y="272" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="600">匹配</text>
<line x1="760" y1="280" x2="806" y2="280" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arr)"/>
<text x="785" y="272" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="600">起机</text>
<line x1="1080" y1="280" x2="1126" y2="280" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arr)"/>
<text x="1105" y="272" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="600">执行</text>
<rect x="40" y="500" width="1210" height="180" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" filter="url(#sh)"/>
<text x="60" y="532" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">通用最佳实践（自己业务照做）</text>
<text x="60" y="560" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="start">① 触发精确化</text>
<text x="60" y="580" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">用 branches / paths 过滤，别每次 push 全量跑，省时省钱</text>
<text x="470" y="560" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="start">② concurrency 去重</text>
<text x="470" y="580" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">新 push 自动取消同分支旧运行，避免堆积</text>
<text x="880" y="560" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="start">③ secrets 存密钥</text>
<text x="880" y="580" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">凭证放仓库 Secrets，禁硬编码进 yaml</text>
<text x="60" y="620" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="start">④ 复用 workflow</text>
<text x="60" y="640" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">公共逻辑抽成 workflow_call，多仓库共享（plaud 就这么做）</text>
<text x="470" y="620" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="start">⑤ 最小权限</text>
<text x="470" y="640" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">permissions 只给必要权限，默认收紧</text>
<text x="880" y="620" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="start">⑥ 固定 action 版本</text>
<text x="880" y="640" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">uses 锁到 @v4 或 commit，防上游变更炸掉流水线</text>
</svg>