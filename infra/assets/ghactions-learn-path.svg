<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1044" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
<defs>
<marker id="down" markerWidth="10" markerHeight="8" refX="5" refY="7" orient="auto"><path d="M0,0 L10,0 L5,8 Z" fill="#94a3b8"/></marker>
<filter id="sh" x="-8%" y="-8%" width="116%" height="128%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.12"/></filter>
</defs>
<rect x="0" y="0" width="1120" height="1044" fill="#ffffff"/>
<text x="60" y="50" font-size="24" font-weight="700" fill="#0f172a" text-anchor="start">GitHub Actions 学习路线：一条 CI 从 5 行长成生产级</text>
<text x="60" y="78" font-size="14" font-weight="400" fill="#64748b" text-anchor="start">做中带学 —— 每一步先动手改配置、push 看结果，再理解这步用到的知识点。终点就是 plaud 的真实 CI。</text>
<line x1="52" y1="162.0" x2="52" y2="282.0" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#down)"/>
<circle cx="52" cy="162.0" r="17" fill="#3b82f6"/>
<text x="52" y="167.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<rect x="92" y="108" width="968" height="108" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#sh)"/>
<rect x="92" y="108" width="6" height="108" rx="3" fill="#3b82f6"/>
<text x="114" y="138" font-size="16" font-weight="700" fill="#3b82f6" text-anchor="start">第 1 步 · 让它自动跑起来</text>
<text x="114" y="164" font-size="12.5" font-weight="700" fill="#475569" text-anchor="start">做：</text>
<text x="148" y="164" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">新建 .github/workflows/ci.yaml，写最小 5 行后 push</text>
<text x="114" y="192" font-size="12.5" font-weight="700" fill="#475569" text-anchor="start">现学：</text>
<text x="162" y="192" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start">on: push 是触发开关 · jobs / steps 结构 · runs-on 选机器 · run 执行命令 · 去 Actions 页看它跑</text>
<line x1="52" y1="282.0" x2="52" y2="402.0" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#down)"/>
<circle cx="52" cy="282.0" r="17" fill="#06b6d4"/>
<text x="52" y="287.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<rect x="92" y="228" width="968" height="108" rx="12" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.5" filter="url(#sh)"/>
<rect x="92" y="228" width="6" height="108" rx="3" fill="#06b6d4"/>
<text x="114" y="258" font-size="16" font-weight="700" fill="#06b6d4" text-anchor="start">第 2 步 · 让 runner 拿到代码</text>
<text x="114" y="284" font-size="12.5" font-weight="700" fill="#475569" text-anchor="start">做：</text>
<text x="148" y="284" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">加一步 uses: actions/checkout@v4</text>
<text x="114" y="312" font-size="12.5" font-weight="700" fill="#475569" text-anchor="start">现学：</text>
<text x="162" y="312" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start">runner 是台空白机器，默认没有你的代码 · uses: 复用现成 Action · @v4 锁版本</text>
<line x1="52" y1="402.0" x2="52" y2="522.0" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#down)"/>
<circle cx="52" cy="402.0" r="17" fill="#22c55e"/>
<text x="52" y="407.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<rect x="92" y="348" width="968" height="108" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5" filter="url(#sh)"/>
<rect x="92" y="348" width="6" height="108" rx="3" fill="#22c55e"/>
<text x="114" y="378" font-size="16" font-weight="700" fill="#22c55e" text-anchor="start">第 3 步 · 控制「什么时候跑」</text>
<text x="114" y="404" font-size="12.5" font-weight="700" fill="#475569" text-anchor="start">做：</text>
<text x="148" y="404" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">给 on: push 加 branches / paths 过滤</text>
<text x="114" y="432" font-size="12.5" font-weight="700" fill="#475569" text-anchor="start">现学：</text>
<text x="162" y="432" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start">触发过滤，别全量跑 · 顺带认识其它事件：pull_request / schedule / workflow_dispatch(手动)</text>
<line x1="52" y1="522.0" x2="52" y2="642.0" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#down)"/>
<circle cx="52" cy="522.0" r="17" fill="#eab308"/>
<text x="52" y="527.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<rect x="92" y="468" width="968" height="108" rx="12" fill="#fefce8" stroke="#eab308" stroke-width="1.5" filter="url(#sh)"/>
<rect x="92" y="468" width="6" height="108" rx="3" fill="#eab308"/>
<text x="114" y="498" font-size="16" font-weight="700" fill="#eab308" text-anchor="start">第 4 步 · 拆成多个作业</text>
<text x="114" y="524" font-size="12.5" font-weight="700" fill="#475569" text-anchor="start">做：</text>
<text x="148" y="524" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">把活拆成两个 job，用 needs 串起来</text>
<text x="114" y="552" font-size="12.5" font-weight="700" fill="#475569" text-anchor="start">现学：</text>
<text x="162" y="552" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start">job 默认并行、各占一台独立 runner · needs 声明依赖改成串行 · step 在 job 内顺序执行</text>
<line x1="52" y1="642.0" x2="52" y2="762.0" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#down)"/>
<circle cx="52" cy="642.0" r="17" fill="#f97316"/>
<text x="52" y="647.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
<rect x="92" y="588" width="968" height="108" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="1.5" filter="url(#sh)"/>
<rect x="92" y="588" width="6" height="108" rx="3" fill="#f97316"/>
<text x="114" y="618" font-size="16" font-weight="700" fill="#f97316" text-anchor="start">第 5 步 · 作业之间传数据</text>
<text x="114" y="644" font-size="12.5" font-weight="700" fill="#475569" text-anchor="start">做：</text>
<text x="148" y="644" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">让上游 job 用 outputs 输出、下游 job 读取</text>
<text x="114" y="672" font-size="12.5" font-weight="700" fill="#475569" text-anchor="start">现学：</text>
<text x="162" y="672" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start">job 间不共享文件系统和内存 · 跨 job 传值只能靠 outputs</text>
<line x1="52" y1="762.0" x2="52" y2="882.0" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#down)"/>
<circle cx="52" cy="762.0" r="17" fill="#ef4444"/>
<text x="52" y="767.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
<rect x="92" y="708" width="968" height="108" rx="12" fill="#fff1f2" stroke="#ef4444" stroke-width="1.5" filter="url(#sh)"/>
<rect x="92" y="708" width="6" height="108" rx="3" fill="#ef4444"/>
<text x="114" y="738" font-size="16" font-weight="700" fill="#ef4444" text-anchor="start">第 6 步 · 真构建镜像 + 用密钥</text>
<text x="114" y="764" font-size="12.5" font-weight="700" fill="#475569" text-anchor="start">做：</text>
<text x="148" y="764" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">docker build / push，凭证用 ${{ secrets.X }}</text>
<text x="114" y="792" font-size="12.5" font-weight="700" fill="#475569" text-anchor="start">现学：</text>
<text x="162" y="792" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start">secrets 存仓库 Settings，禁明文 · 产物镜像 tag = 本次 commit 短 SHA(前7位)</text>
<circle cx="52" cy="882.0" r="17" fill="#a855f7"/>
<text x="52" y="887.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">7</text>
<rect x="92" y="828" width="968" height="108" rx="12" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5" filter="url(#sh)"/>
<rect x="92" y="828" width="6" height="108" rx="3" fill="#a855f7"/>
<text x="114" y="858" font-size="16" font-weight="700" fill="#a855f7" text-anchor="start">第 7 步 · 复用组织级流水线</text>
<text x="114" y="884" font-size="12.5" font-weight="700" fill="#475569" text-anchor="start">做：</text>
<text x="148" y="884" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">构建逻辑换成 uses: 外部 workflow + with + secrets: inherit</text>
<text x="114" y="912" font-size="12.5" font-weight="700" fill="#475569" text-anchor="start">现学：</text>
<text x="162" y="912" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start">workflow_call 让流水线可被复用 · with 传参 · secrets: inherit 继承密钥 —— 这就是 plaud 的形态</text>
<rect x="92" y="952" width="968" height="66" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="5,4"/>
<text x="112" y="979" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="start">到第 7 步已是 plaud 真实 CI 的形态；之后再按需加固：</text>
<text x="112" y="1002" font-size="13" font-weight="400" fill="#475569" text-anchor="start">concurrency 去重  ·  permissions 最小权限  ·  uses 固定版本  ·  actions/cache 缓存依赖</text>
</svg>